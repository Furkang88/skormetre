<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-F MATRIX NETWORK v8.7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Orbitron:wght@500;800&display=swap');

        :root {
            --bg-black: #030305;
            --matrix-green: #00ff66;
            --matrix-glow: rgba(0, 255, 102, 0.35);
            --panel-bg: rgba(10, 15, 12, 0.8);
            --panel-border: rgba(0, 255, 102, 0.2);
            --text-white: #ffffff;
            --text-muted: #70a080;
            --danger-red: #ff3333;
            --warning-yellow: #ffcc00;
            
            --kaan-badge: #8e44ad;
            --furkan-badge: #d35400;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        body {
            font-family: 'Fira Code', monospace;
            background-color: var(--bg-black);
            color: var(--text-white);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 100%;
            max-width: 650px; /* Sütunlar için genişlik biraz artırıldı */
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.15);
            border: 1px solid var(--panel-border);
            overflow: hidden;
            animation: terminalBoot 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes terminalBoot {
            from { opacity: 0; transform: scale(0.95); filter: blur(5px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        .header {
            background: rgba(5, 8, 6, 0.9);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid var(--panel-border);
            position: relative;
        }

        .header::after {
            content: ''; position: absolute; bottom: -1px; left: 10%; width: 80%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--matrix-green), transparent);
            box-shadow: 0 0 10px var(--matrix-green);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif; margin: 0; font-size: 1.4rem;
            font-weight: 800; color: var(--matrix-green); text-shadow: 0 0 12px var(--matrix-green);
        }

        .sub-header { color: var(--text-muted); font-size: 0.8rem; margin-top: 6px; font-weight: bold; letter-spacing: 2px; }
        .section-wrapper { padding: 25px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 18px; }
        .form-group { display: flex; flex-direction: column; width: 100%; }
        .flex-1 { flex: 1; }

        label {
            font-size: 0.8rem; font-weight: bold; color: var(--matrix-green);
            margin-bottom: 8px; letter-spacing: 1px; text-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
        }

        label span { color: var(--text-white); opacity: 0.7; font-size: 0.75rem; }
        label .red-span { color: var(--danger-red); text-shadow: 0 0 5px var(--danger-red); }

        input, select {
            background: rgba(5, 5, 8, 0.85); border: 1px solid rgba(0, 255, 102, 0.2);
            color: #fff; padding: 14px 16px; border-radius: 10px; font-size: 0.95rem;
            font-family: 'Fira Code', monospace; outline: none; transition: all 0.3s ease;
        }

        input:focus, select:focus { border-color: var(--matrix-green); box-shadow: 0 0 15px var(--matrix-glow); background: rgba(10, 15, 12, 0.95); }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'><path stroke='%2300ff66' stroke-width='1.5' d='m1 1 4 4 4-4'/></svg>");
            background-repeat: no-repeat; background-position: right 16px center; padding-right: 40px; cursor: pointer;
        }

        .btn-submit {
            background: transparent; color: var(--matrix-green); border: 1px solid var(--matrix-green);
            padding: 16px; font-size: 1.05rem; font-weight: bold; font-family: 'Orbitron', sans-serif;
            border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.3s ease;
            text-transform: uppercase; margin-top: 10px; letter-spacing: 1px;
        }

        .btn-submit:hover { background: var(--matrix-green); color: var(--bg-black); box-shadow: 0 0 25px var(--matrix-green); transform: translateY(-1px); }

        .result-panel {
            background: rgba(3, 5, 4, 0.9); border-radius: 14px; padding: 22px; border: 1px solid var(--matrix-green);
            margin-top: 25px; display: none; animation: panelSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes panelSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .result-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: bold; color: var(--matrix-green); margin-bottom: 15px; border-bottom: 1px solid rgba(0, 255, 102, 0.2); padding-bottom: 10px; }
        .result-item { margin: 8px 0; font-size: 0.95rem; color: var(--text-muted); }
        .result-item b { color: #fff; }

        .final-score {
            font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 800; margin: 20px 0;
            padding: 16px; border-radius: 10px; background: rgba(0, 0, 0, 0.5); text-align: center;
            border: 1px solid rgba(0, 255, 102, 0.15); text-shadow: 0 0 15px currentColor;
        }

        .action-plan { margin-top: 10px; line-height: 1.6; font-size: 0.9rem; color: #ffaa40; background: rgba(255, 170, 64, 0.05); padding: 14px; border-radius: 8px; border-left: 3px solid #ffaa40; }

        .archive-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
