            border-radius: 20px;

<script>
    // --- MATRIX BG SAFE ANIMATION ---
    try {
        const canvas = document.getElementById('matrixCanvas'); const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth || 800; canvas.height = window.innerHeight || 600; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);
        const alphabet = "010101ABCDEFGHIJKLMNOPQRSTUVWXYZ010101"; const fontSize = 14; const columns = Math.floor(canvas.width / fontSize) || 20;
        const rainDrops = Array.from({ length: columns }).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 3, 5, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                const x = i * fontSize; const y = rainDrops[i] * fontSize;
                ctx.fillStyle = Math.random() > 0.98 ? '#fff' : '#00ff66'; ctx.fillText(text, x, y);
                if (y > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);
    } catch(e) { console.log("Canvas animation bypassed."); }

    function switchTab(tabId, btn) {

        document.getElementById(tabId).classList.add('active');

                <path d='M20 76 Q 45 68 70 76 L 75 90 L 15 90 Z' fill='#111' stroke='#70a080' stroke-width='1'/>
                <path d='M38 66 L 45 78 L 52 66 Z' fill='#fff'/>
                <path d='M43 74 L 47 74 L 49 90 L 41 90 Z' fill='#ff3333'/>
            `;
        } else if(giyim === "Goth") {
            clothingHtml = `
                <path d='M20 76 Q 45 68 70 76 L 75 90 L 15 90 Z' fill='#050505' stroke='#ff3333' stroke-width='1'/>
                <rect x='38' y='61' width='14' height='4' fill='#222' stroke='#aaa' stroke-width='1'/>
                <circle cx='45' cy='63' r='1.5' fill='#fff'/>
            `;
        }

        // Yüz Hatları ve Makyaj Modifikasyonları
        let yuzEkstraHtml = "";
        let yuzRengi = "#f3d2c1";
        let ceneTipi = `<circle cx='45' cy='44' r='22' fill='${yuzRengi}'/>`; // Standart dairesel yüz

        if(yuzHat === "Keskin") {
            ceneTipi = `<path d='M23 44 C23 25, 67 25, 67 44 C67 58, 45 68, 45 68 C45 68, 23 58, 23 44 Z' fill='${yuzRengi}'/>`;
            yuzEkstraHtml += `<path d='M26 48 Q 32 52 35 49' fill='none' stroke='#d2b4a1' stroke-width='1.5'/>
                             <path d='M64 48 Q 58 52 55 49' fill='none' stroke='#d2b4a1' stroke-width='1.5'/>`;
        } else if(yuzHat === "Soft") {
            yuzEkstraHtml += `<circle cx='29' cy='49' r='4' fill='rgba(255, 51, 51, 0.25)'/>
                             <circle cx='61' cy='49' r='4' fill='rgba(255, 51, 51, 0.25)'/>`;
        } else if(yuzHat === "Eyeliner") {
            yuzEkstraHtml += `<path d='M30 44 L 25 41' stroke='#000' stroke-width='2' stroke-linecap='round'/>
                             <path d='M60 44 L 65 41' stroke='#000' stroke-width='2' stroke-linecap='round'/>`;
        } else if(yuzHat === "Piercing") {
            yuzEkstraHtml += `<circle cx='39' cy='55' r='1.8' fill='none' stroke='#aaa' stroke-width='1.5'/>`;
        }

        let hairBackHtml = "";
        let hairFrontHtml = "";

        if(saçUzunluk === "Uzun") {
            hairBackHtml = `<rect x='22' y='25' width='46' height='45' rx='10' fill='${hairColorHex}'/>`;
        } else if(saçUzunluk === "Omuz") {
            hairBackHtml = `<rect x='24' y='25' width='42' height='30' rx='8' fill='${hairColorHex}'/>`;
        }

        if(saçŞekil === "Kıvırcık") {
            hairFrontHtml = `<circle cx='30' cy='24' r='7' fill='${hairColorHex}'/>
                             <circle cx='45' cy='22' r='8' fill='${hairColorHex}'/>
                             <circle cx='60' cy='24' r='7' fill='${hairColorHex}'/>
                             <circle cx='24' cy='32' r='6' fill='${hairColorHex}'/>
                             <circle cx='66' cy='32' r='6' fill='${hairColorHex}'/>`;
        } else if(saçŞekil === "Dalgalı") {
            hairFrontHtml = `<path d='M22 26 Q 45 14 68 26 Q 55 32 45 28 Q 35 32 22 26 Z' fill='${hairColorHex}'/>
                             <path d='M22 26 Q 16 38 25 44' fill='none' stroke='${hairColorHex}' stroke-width='5' stroke-linecap='round'/>
                             <path d='M68 26 Q 74 38 65 44' fill='none' stroke='${hairColorHex}' stroke-width='5' stroke-linecap='round'/>`;
        } else {
            hairFrontHtml = `<path d='M22 28 Q 45 16 68 28 Q 66 38 64 42 Q 45 26 26 42 Z' fill='${hairColorHex}'/>`;
        }

        return `<svg class='avatar-svg' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'>
            ${hairBackHtml}
            <rect x='40' y='58' width='10' height='12' rx='2' fill='#e0ae98'/>
            ${ceneTipi}
            <circle cx='35' cy='44' r='2' fill='#333'/>
            <circle cx='55' cy='44' r='2' fill='#333'/>
            <path d='M41 53 Q 45 56 49 53' fill='none' stroke='#e74c3c' stroke-width='1.5' stroke-linecap='round'/>
            ${yuzEkstraHtml}
            ${hairFrontHtml}
            ${gozlukHtml}
            ${clothingHtml}
        </svg>`;
    }

    function renderLiveAvatar() {
        let sRenk = document.getElementById('p_saçRenk').value;
        let sUzunluk = document.getElementById('p_saçUzunluk').value;
        let sSekil = document.getElementById('p_saçŞekil').value;
        let gozluk = document.getElementById('p_gozluk').value;
        let giyim = document.getElementById('p_giyim').value;
        let yuzHat = document.getElementById('p_yuzHat').value;
        
        document.getElementById('avatarContainer').innerHTML = generateAvatarSVG(sRenk, sUzunluk, sSekil, gozluk, giyim, yuzHat);
    }

    function matrisiHesapla(isPremium) {
        let prefix = isPremium ? "p_" : "";
        
        let op = document.getElementById(prefix + 'operator').value;
        let isim = document.getElementById(prefix + 'isim').value.trim();
        let G = parseFloat(document.getElementById(prefix + 'safPuan').value);
        let O = parseFloat(document.getElementById(prefix + 'ozguven').value);
        let L = parseFloat(document.getElementById(prefix + 'lojistik').value);
        let R = parseFloat(document.getElementById(prefix + 'redflag').value);
        
        let selectLig = document.getElementById(prefix + 'lig');
        let carpan = parseFloat(selectLig.value);
        let ligMetni = selectLig.options[selectLig.selectedIndex].text.split(" ->")[0];

        if (!isim || isim.toLowerCase() === 'geç') isim = "Kayıtsız Hedef";

        if (isNaN(G) || G < 1 || G > 10 || isNaN(O) || O < 1 || O > 10 || isNaN(L) || L < 1 || L > 10 || isNaN(R) || R < 1 || R > 10) {
            alert("🚨 HATA: Tüm parametreler 1.0 ile 10.0 arasında girilmelidir.");
            return;
        }

        let pozitifSkor = (G * 0.5) + (O * 0.3) + (L * 0.2);
        let ceza = (R - 1) * 0.22; if (ceza < 0) ceza = 0;
        let hamSkor = pozitifSkor - ceza;
        if (hamSkor < 0) hamSkor = 0; if (hamSkor > 10) hamSkor = 10;
        let finalPuan = Math.round((hamSkor * carpan) * 100) / 100;

        let finalRenk = "var(--danger-red)";
        if (finalPuan >= 6.5) finalRenk = "var(--matrix-green)";
        else if (finalPuan >= 4.5) finalRenk = "var(--warning-yellow)";

        let aksiyon = "";
        if (R >= 7.5) {
            aksiyon = `⚠️ SİSTEM ALARMI: ${op} tarafından saptanan uyumsuzluk/Red Flag derecesi kritik limittedir (${R}). Operasyon durdurulmuştur.`;
        } else if (carpan === 1.0) {
            if (finalPuan >= 7) aksiyon = `🔥 OPERASYON EMRETMESİ: ${op} için tüm parametreler uyumlu. Gidip tanışmak için tam zamanı!`;
            else if (finalPuan >= 4.5) aksiyon = "👀 PASİF TAKİBİ: Potansiyel tespit edildi ancak şartları biraz daha güçlendirmeniz gerek.";
            else aksiyon = "☕ RUTİN SEVİYE: Skor tabanı yetersiz.";
        } else if (carpan === 0.7) {
            aksiyon = G >= 8 ? "📱 SOSYAL MEDYA OPERASYONU: Stratejik bir story etkileşimi bekleyin." : "⏳ BEKLEMEDE KALIN: Ağda hafif etkileşimlerle kalın.";
        } else {
            aksiyon = "🎬 ELIZABETH OLSEN FILTRESI: Arkanıza yaslanıp film açın.";
        }

        document.getElementById('resIsim').innerText = isim.toUpperCase();
        document.getElementById('resKriterler').innerHTML = `Görsel: <b>${G}</b> | Özgüven: <b>${O}</b> | Lojistik: <b>${L}</b> | <span style="color:var(--danger-red)">RF: <b>${R}</b></span>`;
        document.getElementById('resLig').innerText = `${ligMetni} (Analist: ${op})`;
        let resFinal = document.getElementById('resFinal'); resFinal.innerText = `🎯 K-F ENDEKSİ: ${finalPuan} / 10`; resFinal.style.color = finalRenk;
        document.getElementById('resAksiyon').innerText = aksiyon; document.getElementById('resultPanel').style.display = "block";

        let featString = "";
        if(isPremium) {
            let boy = document.getElementById('p_boy').value;
            let sRenk = document.getElementById('p_saçRenk').value;
            let sUzunluk = document.getElementById('p_saçUzunluk').value;
            let sSekil = document.getElementById('p_saçŞekil').value;
            let gozluk = document.getElementById('p_gozluk').value;
            let giyim = document.getElementById('p_giyim').value;
            let yuzHat = document.getElementById('p_yuzHat').value;
            // Tüm yeni parametrelerin bulut için paketlenmesi
            featString = `${boy}/${sUzunluk}-${sSekil}-${sRenk}/Gözlük:${gozluk}/${giyim}/${yuzHat}`;
        }

        bulutaKaydet(isim, finalPuan, finalRenk, op, R, featString);

        document.getElementById(prefix + 'isim').value = ""; document.getElementById(prefix + 'safPuan').value = "";
        document.getElementById(prefix + 'ozguven').value = ""; document.getElementById(prefix + 'lojistik').value = ""; document.getElementById(prefix + 'redflag').value = "";
    }

    function bulutaKaydet(isim, puan, renk, op, rf, features) {
        let simdi = new Date();
        let tarihTxt = simdi.toLocaleDateString('tr-TR') + " " + simdi.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        let yeniKayit = { id: Date.now(), tarih: tarihTxt, ad: isim.toUpperCase(), skor: puan, renk: renk, operator: op, redflag: rf, features: features };

        fetch(DB_URL, { method: 'POST', body: JSON.stringify(yeniKayit), headers: { 'Content-Type': 'application/json' } })
        .then(() => arsiviListele());
    }

    function arsiviListele() {
        fetch(DB_URL)
        .then(res => res.json())
        .then(data => {
            let kaanDiv = document.getElementById("kaanList");
            let furkanDiv = document.getElementById("furkanList");
            if(!kaanDiv || !furkanDiv) return;
            kaanDiv.innerHTML = ""; furkanDiv.innerHTML = "";

            if (!data) {
                kaanDiv.innerHTML = `<div style="color: var(--text-muted); font-size:0.75rem; text-align:center; padding:10px;">Temiz...</div>`;
                furkanDiv.innerHTML = `<div style="color: var(--text-muted); font-size:0.75rem; text-align:center; padding:10px;">Temiz...</div>`;
                return;
            }

            let kayitlar = Object.keys(data).map(key => ({firebaseKey: key, ...data[key]})).reverse();
            let kaanSayac = 0; let furkanSayac = 0;

            kayitlar.forEach(item => {
                let avatarHtml = "";
                let featureLine = "";
                
                if(item.features) {
                    let parts = item.features.split("/");
                    let saçPartları = parts[1].split("-");
                    let gozlukDurumu = parts[2].split(":")[1];
                    let giyimModu = parts[3] || "Casual";
                    let yuzModu = parts[4] || "Standart";
                    
                    // Şifreli veri çözülerek minyatür avatar yeniden üretilir
                    avatarHtml = generateAvatarSVG(saçPartları[2], saçPartları[0], saçPartları[1], gozlukDurumu, giyimModu, yuzModu);
                    featureLine = `<span class="archive-features">✨ ${parts[0]} | ${giyimModu} | ${yuzModu}</span>`;
                } else {
                    avatarHtml = generateAvatarSVG("Siyah", "Kısa", "Düz", "Yok", "Casual", "Standart");
                }

                let htmlIcerik = `
                    <div class="archive-item" style="border-left-color: ${item.renk}">
                        <div class="item-left-block">
                            <div class="archive-avatar-mini">${avatarHtml}</div>
                            <div>
                                <span class="archive-name" title="${item.ad}">${item.ad}</span>
                                <span class="archive-meta">📅 ${item.tarih.split(" ")[0]} | 🚩:${item.redflag}</span>
                                ${featureLine}
                            </div>
                        </div>
                        <div class="archive-right">
                            <span class="archive-score" style="color: ${item.renk}">${item.skor}</span>
                            <button class="delete-btn" onclick="buluttanSil('${item.firebaseKey}')">✕</button>
                        </div>
                    </div>
                `;

                if (item.operator && item.operator.includes("KAAN")) {
                    kaanDiv.innerHTML += htmlIcerik; kaanSayac++;
                } else {
                    furkanDiv.innerHTML += htmlIcerik; furkanSayac++;
                }
            });

            if(kaanSayac === 0) kaanDiv.innerHTML = `<div style="color: var(--text-muted); font-size:0.75rem; text-align:center; padding:10px;">Kayıt Yok</div>`;
            if(furkanSayac === 0) furkanDiv.innerHTML = `<div style="color: var(--text-muted); font-size:0.75rem; text-align:center; padding:10px;">Kayıt Yok</div>`;
        }).catch(err => console.log("Cloud sync..."));
    }

    function buluttanSil(key) {
        if (confirm("Bu kaydı ortak buluttan kalıcı olarak silmek istiyor musunuz?")) {
            fetch(BASE_DELETE_URL + key + ".json", { method: 'DELETE' })
            .then(() => arsiviListele());
        }
    }

    function arsiviTemizle() {
        if (confirm("KRİTİK UYARI: Tüm bulut veri havuzu kalıcı olarak imha edilecek! Emin misiniz?")) {
            fetch(DB_URL, { method: 'DELETE' }).then(() => arsiviListele());
        }
    }

    function arsiviFiltrele() {
        let arananHarf = document.getElementById('searchInput').value.toUpperCase();
        let items = document.getElementsByClassName('archive-item');
        for (let i = 0; i < items.length; i++) {
            let isimAlani = items[i].getElementsByClassName('archive-name')[0];
            if (isimAlani) {
                let metinDeğeri = isimAlani.textContent || isimAlani.innerText;
                items[i].style.display = metinDeğeri.toUpperCase().indexOf(arananHarf) > -1 ? "" : "none";
            }
        }
    }
</script>
